name: Update RAG Index
on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 0"
  push:
    branches: [main]
    paths:
      - "portfolio_agent/knowledge/**/*.md"
      - "scripts/ingest_knowledge.py"
permissions:
  contents: write
concurrency:
  group: portfolio-rag-index
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate index
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python scripts/ingest_knowledge.py
      - name: Commit index
        run: |
          if git diff --quiet -- portfolio_agent/vector_store/portfolio_index.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio_agent/vector_store/portfolio_index.json
          git commit -m "chore: refresh RAG index"
          git push
